[package]
name = "watermark-rust"
version = "0.1.0"
description = "Offline PDF Watermark tool"
authors = ["Local project"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "watermark_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"   # Android SAF save dialog (file *open* is served by the WebView <input type=file>)
tauri-plugin-fs = "2"       # writes to the content:// URI returned by the save dialog
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
